<title>Agenda de Alunos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: faixa de boas-vindas com resumo, abas com indicador deslizante, semana em grade de horários (lista por dia no celular), cada aluno com sua cor. */
:root {
  --bg: #eef1f6; --surface: #ffffff; --surface2: #e6eaf2; --fg: #101828; --muted: #5b6880; --line: #d8deea;
  --ink: #101828; --ink-fg: #ffffff; --accent: #d93a1f; --accent-soft: #fde6e0;
  --hero: #101c33; --hero-fg: #f2f5fb; --hero-muted: #a9b6cf; --hero-chip: rgba(255,255,255,.08); --hero-line: rgba(255,255,255,.14);
  --ok-bg: #d9f1dc; --ok-fg: #006300; --warn-bg: #fdeccb; --warn-fg: #7a4a00; --bad-bg: #fbdcdc; --bad-fg: #a82727;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --sink1: #ffffff; --sink2: #ffffff; --sink3: #ffffff; --sink4: #0b0b0b; --sink5: #ffffff; --sink6: #ffffff; --sink7: #ffffff; --sink8: #ffffff;
  --bar-prev: #86b6ef; --bar-rec: #256abf;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 6px 20px rgba(16,24,40,.06);
  --font-display: 'Bricolage Grotesque', 'Inter', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1120; --surface: #121b2e; --surface2: #1a2640; --fg: #e8edf7; --muted: #93a1bb; --line: #263350;
    --ink: #eef2fb; --ink-fg: #0d1526; --accent: #ff7b5c; --accent-soft: #3b1f1a;
    --hero: #18264a; --hero-fg: #f2f5fb; --hero-muted: #a9b6cf; --hero-chip: rgba(255,255,255,.07); --hero-line: rgba(255,255,255,.12);
    --ok-bg: #12351a; --ok-fg: #5fd078; --warn-bg: #3a2f10; --warn-fg: #f2b84b; --bad-bg: #431f1f; --bad-fg: #ff8d8d;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --sink4: #ffffff; --bar-prev: #1c5cab; --bar-rec: #5598e7;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1120; --surface: #121b2e; --surface2: #1a2640; --fg: #e8edf7; --muted: #93a1bb; --line: #263350;
  --ink: #eef2fb; --ink-fg: #0d1526; --accent: #ff7b5c; --accent-soft: #3b1f1a;
  --hero: #18264a; --hero-fg: #f2f5fb; --hero-muted: #a9b6cf; --hero-chip: rgba(255,255,255,.07); --hero-line: rgba(255,255,255,.12);
  --ok-bg: #12351a; --ok-fg: #5fd078; --warn-bg: #3a2f10; --warn-fg: #f2b84b; --bad-bg: #431f1f; --bad-fg: #ff8d8d;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --sink4: #ffffff; --bar-prev: #1c5cab; --bar-rec: #5598e7;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 18px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
@keyframes rise { from { opacity: .35; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes slideIn { from { transform: translateX(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes pop { from { transform: scale(.96); opacity: .4; } to { transform: none; opacity: 1; } }
.view { animation: rise .28s ease both; }

/* Barra do topo */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.logo { width: 38px; height: 38px; border-radius: 12px; background: var(--ink); color: var(--ink-fg); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.brand b { font-family: var(--font-display); font-size: 19px; letter-spacing: -0.01em; }
.tabs { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); padding: 4px; border-radius: 14px; min-width: min(100%, 420px); flex: 0 1 460px; }
.tab-ind { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 3); border-radius: 10px; background: var(--ink); transform: translateX(calc(var(--i) * 100%)); transition: transform .28s cubic-bezier(.3,.9,.3,1); }
.tab { position: relative; z-index: 1; border: 0; background: transparent; padding: 9px 12px; border-radius: 10px; font-weight: 600; color: var(--muted); transition: color .2s; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink-fg); }
.tab:not([aria-selected="true"]):hover { color: var(--fg); }
.theme { border: 1px solid var(--line); background: var(--surface); width: 42px; height: 42px; border-radius: 12px; font-size: 18px; display: grid; place-items: center; padding: 0; }
.theme:hover { border-color: var(--accent); }

/* Hero */
.hero { background: var(--hero); color: var(--hero-fg); border-radius: 20px; padding: 22px; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.6fr); gap: 20px; position: relative; overflow: hidden; }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; } }
.hero::after { content: "Hello"; position: absolute; right: -10px; bottom: -34px; font-family: var(--font-display); font-weight: 800; font-size: 150px; line-height: 1; letter-spacing: -0.04em; color: rgba(255,255,255,.04); pointer-events: none; }
.hero h1 { font-size: clamp(28px, 4.2vw, 42px); line-height: 1.05; font-weight: 800; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .pt { color: var(--hero-muted); margin-top: 8px; max-width: 38ch; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; position: relative; z-index: 1; }
@media (max-width: 640px) { .stats { grid-template-columns: 1fr; } }
.stat { text-align: left; border: 1px solid var(--hero-line); background: var(--hero-chip); color: inherit; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; transition: transform .18s, background .18s, border-color .18s; min-width: 0; }
.stat:hover { transform: translateY(-2px); background: rgba(255,255,255,.13); border-color: rgba(255,255,255,.3); }
.stat .k { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--hero-muted); }
.stat .v { font-family: var(--font-display); font-size: 34px; font-weight: 800; line-height: 1.1; overflow-wrap: anywhere; }
.stat .s { font-size: 13px; color: var(--hero-muted); overflow-wrap: anywhere; }
.meter { height: 6px; border-radius: 99px; background: rgba(255,255,255,.14); margin-top: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .5s ease; }

/* Botões e campos */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 11px; font-weight: 600; min-height: 40px; transition: transform .12s, border-color .15s, background .15s; }
.btn:hover { border-color: var(--fg); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.btn.primary:hover { filter: brightness(1.15); }
.btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.danger { color: var(--bad-fg); border-color: var(--bad-fg); background: transparent; }
.btn.small { padding: 4px 11px; min-height: 32px; font-size: 13px; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); width: 40px; height: 40px; border-radius: 11px; font-size: 18px; line-height: 1; display: inline-grid; place-items: center; padding: 0; transition: border-color .15s, transform .12s; }
.icon-btn:hover { border-color: var(--fg); }
.icon-btn:active { transform: scale(.94); }
.icon-btn.small { width: 30px; height: 30px; font-size: 16px; border-radius: 9px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.toolbar .grow { flex: 1 1 200px; min-width: 0; }
.range { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; background: var(--warn-bg); color: var(--warn-fg); padding: 10px 14px; border-radius: 12px; font-weight: 500; }
.banner.bad { background: var(--bad-bg); color: var(--bad-fg); }
.tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface2); color: var(--muted); white-space: nowrap; letter-spacing: .02em; }
.tag.warn { background: var(--warn-bg); color: var(--warn-fg); }
.tag.ok { background: var(--ok-bg); color: var(--ok-fg); }
.tag.bad { background: var(--bad-bg); color: var(--bad-fg); }
.tag.exp { background: var(--accent-soft); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--muted); transition: all .15s; }
.chip:hover { border-color: var(--fg); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }

.avatar { border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; flex: none; letter-spacing: .02em; }

/* Semana: grade de horários */
.tg { display: grid; grid-template-columns: 52px repeat(7, minmax(0, 1fr)); column-gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 10px 10px 14px; box-shadow: var(--shadow); }
.tg-head { text-align: center; padding: 6px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 0; }
.dow { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.dnum { font-family: var(--font-display); font-size: 24px; font-weight: 800; line-height: 1.2; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; }
.tg-head.today .dnum { background: var(--accent); color: #fff; }
.tg-head.today .dow { color: var(--accent); }
.tg-times { position: relative; }
.tg-time { position: absolute; right: 6px; transform: translateY(-8px); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tg-col { position: relative; border-radius: 10px; background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px); background-size: 100% var(--row); cursor: cell; transition: background-color .15s; min-width: 0; }
.tg-col:hover { background-color: color-mix(in srgb, var(--fg) 3%, transparent); }
.tg-col.today { background-color: color-mix(in srgb, var(--accent) 5%, transparent); }
.blk { position: absolute; border-radius: 10px; padding: 5px 8px; overflow: hidden; cursor: pointer; background: color-mix(in srgb, var(--c) 17%, var(--surface)); border-left: 4px solid var(--c); display: flex; flex-direction: column; gap: 0; transition: transform .15s, box-shadow .15s; min-width: 0; line-height: 1.25; }
.blk:hover { transform: translateY(-1px) scale(1.015); box-shadow: 0 6px 18px rgba(0,0,0,.2); z-index: 5; }
.blk[draggable="true"] { cursor: grab; }
.blk-name { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blk-time { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk.tiny { flex-direction: row; align-items: center; gap: 6px; padding-block: 2px; }
.blk.tiny .blk-time { order: -1; }
.blk .tag { align-self: flex-start; margin-top: 2px; }
.blk.reposicao, .blk.extra, .blk.experimental { border-left-style: solid; background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 14%, transparent) 0 6px, transparent 6px 12px); }
.blk.cancelled { opacity: .62; background: var(--surface2); border-left-color: var(--bad-fg); }
.blk.cancelled .blk-name { text-decoration: line-through; }
.tg-hint { position: absolute; left: 3px; right: 3px; border: 2px dashed var(--accent); border-radius: 10px; background: var(--accent-soft); opacity: .8; pointer-events: none; z-index: 4; }
.now { position: absolute; left: 0; right: 0; height: 2px; background: var(--accent); pointer-events: none; z-index: 6; }
.now::before { content: ""; position: absolute; left: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.tip { color: var(--muted); font-size: 13px; }

/* Semana: celular */
.daychips { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dchip { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.dchip b { font-family: var(--font-display); font-size: 18px; }
.dchip small { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.dchip[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.dchip[aria-pressed="true"] small { color: inherit; opacity: .75; }
.dchip.today:not([aria-pressed="true"]) b { color: var(--accent); }
.dots { display: flex; gap: 3px; height: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.dlist { display: flex; flex-direction: column; gap: 10px; }
.lcard { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--line); border-left: 5px solid var(--c); background: var(--surface); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
.lcard .t { font-family: var(--font-display); font-weight: 800; font-size: 19px; font-variant-numeric: tabular-nums; }
.lcard.cancelled { opacity: .65; }
.lcard.cancelled .n { text-decoration: line-through; }
.lcard .n { font-weight: 600; overflow-wrap: anywhere; }
.lcard .m { font-size: 13px; color: var(--muted); }

/* Semana: mês */
.mg { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.mg-h { text-align: center; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); padding: 4px 0; }
.mg-c { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px; min-height: 64px; display: flex; flex-direction: column; gap: 3px; min-width: 0; cursor: pointer; transition: border-color .15s, transform .12s; }
@media (min-width: 900px) { .mg-c { min-height: 112px; } }
.mg-c:hover { border-color: var(--muted); }
.mg-c.out { opacity: .45; }
.mg-c.sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.mg-n { font-family: var(--font-display); font-weight: 800; font-size: 15px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; }
.mg-c.today .mg-n { background: var(--accent); color: #fff; }
@media (max-width: 520px) { .mg-c { padding: 4px 2px; align-items: center; } }
.mg-p { border: 0; border-left: 3px solid var(--c); background: color-mix(in srgb, var(--c) 17%, var(--surface)); border-radius: 6px; padding: 2px 6px; font-size: 12px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }
.mg-p:hover { filter: brightness(1.08); }
.mg-p.cancelled { opacity: .55; text-decoration: line-through; }
.mg-more { font-size: 11px; color: var(--muted); padding-left: 4px; }

/* Alunos */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.scard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 0; overflow: hidden; display: flex; flex-direction: column; min-width: 0; box-shadow: var(--shadow); transition: transform .18s, border-color .18s; animation: rise .3s ease both; }
.scard:hover { transform: translateY(-3px); border-color: var(--c); }
.scard .top { background: color-mix(in srgb, var(--c) 16%, var(--surface)); padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.scard h3 { font-size: 18px; overflow-wrap: anywhere; }
.scard .sub { font-size: 13px; color: var(--muted); }
.scard .body { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.wk { display: flex; gap: 5px; }
.wk span { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--surface2); color: var(--muted); }
.wk span.on { background: var(--c); color: var(--sinkc); }
.srow { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.next { font-size: 13px; }
.next b { font-weight: 600; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); font-size: 13px; }
.search { min-width: 0; flex: 1 1 220px; max-width: 360px; }
.empty { background: var(--surface); border: 2px dashed var(--line); border-radius: 20px; padding: 40px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty h2 { font-size: 24px; }
.empty p { margin: 0; color: var(--muted); max-width: 48ch; }

/* Recebimentos */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow); }
.tile .k { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.tile .v { font-family: var(--font-display); font-size: 34px; font-weight: 800; line-height: 1.15; }
.tile .meter { background: var(--surface2); }
.tile .meter i { background: var(--bar-rec); }
.panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 900px) { .panels { grid-template-columns: 1fr; } }
.panel-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel-card h3 { font-size: 18px; }
.panel-card .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { font-family: var(--font-body); fill: var(--muted); font-size: 11px; }
svg.chart .val { fill: var(--fg); font-weight: 600; }
.rank { display: flex; flex-direction: column; gap: 8px; }
.rk { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; align-items: center; border: 0; background: transparent; padding: 2px 0; text-align: left; }
.rk .nm { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk .tr { position: relative; height: 22px; display: flex; align-items: center; gap: 8px; }
.rk .bar-fill { height: 22px; min-width: 4px; border-radius: 0 4px 4px 0; background: var(--c); transition: width .5s ease, filter .15s; }
.rk:hover .bar-fill, .rk:focus-visible .bar-fill { filter: brightness(1.12) saturate(1.1); }
.rk .vv { font-size: 12px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rk.dim { opacity: .5; }
.prow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.6fr) auto auto; gap: 12px 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; transition: border-color .15s, transform .15s; }
.prow:hover { border-color: var(--c); }
@media (max-width: 760px) { .prow { grid-template-columns: minmax(0, 1fr) auto; } .prow .det { grid-column: 1 / -1; order: 3; } }
.prow .who { display: flex; align-items: center; gap: 12px; min-width: 0; }

      toast ? div({ className: 'toast', role: 'status' }, toast) : null);
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
